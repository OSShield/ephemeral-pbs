services:
  pbs:
    build: .
    image: ghcr.io/osshield/ephemeral-pbs:basic
    hostname: pbs.localhost
    ports:
      - "8007:8007"
    environment:
      TZ: "Europe/Stockholm"
      PASSWORD: "demo"
      POSTFIX: "N"
    # The static PBS filesystem is created inside the image itself.
    # No tmpfs or bind-mounted config/data is required for the basic setup.