services:
  pbs:
    build: .
    image: ghcr.io/osshield/ephemeral-pbs:basic
    hostname: pbs.localhost
    ports:
      - "8007:8007"
    environment:
      TZ: "Europe/Stockholm"
      PASSWORD: "demo"
      POSTFIX: "N"
    # PBS refuses to work correctly (web UI and API) unless /run is on tmpfs.
    tmpfs:
      - /run
